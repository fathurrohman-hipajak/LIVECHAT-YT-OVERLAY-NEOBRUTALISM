name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: "--mac --arm64 --x64"
          - os: windows-latest
            args: "--win --x64"
          - os: ubuntu-latest
            args: "--linux --x64"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.1.43"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install deps
        run: bun install
      - name: Build renderer+main
        run: bun run build
      - name: Build installer
        run: bun run build:installer -- ${{ matrix.args }}
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: |
            dist/*
            !dist/builder-debug.yml
            !dist/builder-effective-config.yaml
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: List artifacts
        run: ls -R dist 2>&1 | head -100; echo "---"; du -sh dist/* 2>&1 | head -20
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body_path: CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
